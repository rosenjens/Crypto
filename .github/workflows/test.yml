name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Compile
        working-directory: java
        run: javac -Xlint:all -d build *.java
      - name: Run tests
        working-directory: java
        run: java -cp build VigenereTest
